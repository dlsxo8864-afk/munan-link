<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>스튜디오 무난 검수</title>
<style>
  :root { --bg: #f6f3ee; --ink: #1f1d1a; --sub: #6b655c; --line: #ddd5c8; --act: #1f1d1a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #171614; --ink: #f2eee8; --sub: #a59d91; --line: #34312c; --act: #f2eee8; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { width: min(420px, calc(100% - 32px)); padding: 28px 0; }
  .brand { font-size: 14px; color: var(--sub); letter-spacing: .02em; }
  h1 { font-size: 22px; line-height: 1.4; margin: 10px 0 8px; word-break: keep-all; }
  p { margin: 0; color: var(--sub); line-height: 1.6; word-break: keep-all; }
  button { margin-top: 20px; padding: 12px 18px; border-radius: 10px; border: 1px solid var(--line); background: transparent;
           color: var(--act); font-size: 15px; font-weight: 600; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--sub); margin-right: 8px;
         animation: blink 1s infinite alternate; }
  @keyframes blink { from { opacity: .25; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
</style>
</head>
<body>
<main>
  <div class="brand">스튜디오 무난 · 회차 검수</div>
  <h1 id="msg"><span class="dot"></span>연결하는 중…</h1>
  <p id="sub"></p>
  <button id="retry" type="button" hidden>다시 시도</button>
</main>
<script>
// 개인용 전달 페이지: 이 PC 에서 지금 열려 있는 터널 주소(origin.json)를 읽어 넘어간다.
// 열쇠는 주소의 # 뒤에만 있다(# 뒤는 서버로 보내지지 않는다). 이 저장소에는 터널 주소만 있다.
const OWNER = 'dlsxo8864-afk', REPO = 'munan-link';
const params = new URLSearchParams(location.hash.slice(1));
const key = params.get('k');
const page = (params.get('p') || 'episodes').replace(/[^a-z0-9/_-]/gi, '');
const msg = document.getElementById('msg'), sub = document.getElementById('sub'), retry = document.getElementById('retry');

function show(title, detail, canRetry) {
  msg.textContent = title;
  sub.textContent = detail || '';
  retry.hidden = !canRetry;
}

async function readJson(url, opts) {
  try {
    const r = await fetch(url, { cache: 'no-store', ...opts });
    return r.ok ? await r.json() : null;
  } catch (e) {
    return null;
  }
}

// 깃허브 API 와 페이지 사본 둘 다 읽어 더 최근(updated) 것을 쓴다. 둘 다 1분쯤 늦을 수 있다.
async function readOrigin() {
  const t = Date.now();
  const found = (await Promise.all([
    readJson(`https://api.github.com/repos/${OWNER}/${REPO}/contents/origin.json?t=${t}`,
             { headers: { Accept: 'application/vnd.github.raw+json' } }),
    readJson(`./origin.json?t=${t}`),
  ])).filter(Boolean);
  if (!found.length) throw new Error('origin');
  return found.sort((a, b) => String(b.updated || '').localeCompare(String(a.updated || '')))[0];
}

const MAX_TRIES = 18;
let tries = 0;
function later(title, detail, wait = 10) {
  // PC가 막 켜졌거나 사이트를 다시 켜는 중이면 정보가 늦게 바뀐다 → 3분 가까이 저절로 다시 확인
  if (tries < MAX_TRIES) {
    tries += 1;
    show(title, `${detail} ${wait}초 뒤 다시 확인합니다(${tries}/${MAX_TRIES}).`, true);
    setTimeout(go, wait * 1000);
  } else {
    show(title, detail, true);
  }
}

async function alive(base) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 8000);
  try {
    const r = await fetch(`${base}/__alive?t=${Date.now()}`, { cache: 'no-store', signal: ctrl.signal });
    return r.ok ? await r.json() : null;
  } catch (e) {
    return null;
  } finally {
    clearTimeout(timer);
  }
}

async function go() {
  if (!key) {
    show('열쇠가 없는 주소입니다', '받은 링크를 # 뒤까지 그대로 열어 주세요.', false);
    return;
  }
  msg.innerHTML = '<span class="dot"></span>연결하는 중…';
  sub.textContent = '';
  retry.hidden = true;
  let info;
  try {
    info = await readOrigin();
  } catch (e) {
    later('연결 정보를 읽지 못했습니다', '폰의 인터넷 연결을 확인해 주세요.');
    return;
  }
  const when = info.updated ? `마지막 연결 ${String(info.updated).slice(0, 16)}.` : '';
  if (!info.origin || info.status !== 'open') {
    later('PC 쪽 연결이 꺼져 있습니다', `${when} PC가 켜지면 1~2분 안에 저절로 열립니다.`);
    return;
  }
  const base = info.origin.replace(/\/+$/, '');
  const state = await alive(base);
  if (!state) {
    later('PC에 연결되지 않습니다', `${when} PC가 꺼졌거나 연결을 새로 잇는 중입니다(새로 잇는 중이면 1분 안에 열립니다).`);
    return;
  }
  if (!state.hub) {
    // 상시 모드의 PC는 사이트가 꺼지면 15초 뒤 스스로 다시 켠다
    if (state.starting && (state.fails || 0) < 3) later('사이트를 켜는 중입니다', '잠시 뒤 저절로 열립니다.', 5);
    else if (state.starting) later('사이트가 켜지지 않습니다', 'PC가 계속 다시 켜 보는 중입니다.');
    else later('사이트가 꺼져 있습니다', 'PC에서 사이트를 켜면 바로 열립니다.');
    return;
  }
  location.replace(`${base}/?k=${encodeURIComponent(key)}#/${page}`);
}

retry.addEventListener('click', () => { tries = 0; go(); });
go();
</script>
</body>
</html>
